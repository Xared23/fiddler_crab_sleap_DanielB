[project]
name = "fiddler-crab-sleap"
version = "0.1.0"
description = "SLEAP remapping and training jobs for fiddler crab pose tracking."
requires-python = ">=3.11,<3.14"
dependencies = [
    "sleap-io[all]>=0.9.2,<0.10",
    # v004 gap bridging: learned link scorer (HistGradientBoosting) loaded at run time.
    "scikit-learn>=1.5,<2",
]

[project.optional-dependencies]
# GPU training / inference (sleap-nn CLI). Matches the v004 yaml pin of 0.3.x.
train = [
    "sleap-nn>=0.3.0,<0.4",
]
# Test tooling for the gap-bridging suite (unit, integration, property tests).
dev = [
    "pytest>=8,<10",
    "hypothesis>=6.100,<7",
    "flake8>=7,<8",
]

[tool.uv]
package = false

# Della A100s: pull CUDA 12.8 PyTorch wheels when the train extra is installed.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
]
torchvision = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
]

# Near-mirror of .flake8 for anyone who prefers ruff (E112/E113 are preview-only there).
[tool.ruff]
line-length = 120
extend-exclude = ["logs", "predictions", "**/source/**"]

[tool.ruff.lint]
select = ["F", "E9", "E101"]

[tool.ruff.lint.per-file-ignores]
"scripts/body_first_tracklets.py" = ["F401"]
"scripts/prediction_run.py" = ["F841"]
"scripts/milestone_checkpoints.py" = ["F401"]
"tests/test_prediction_run.py" = ["F401"]
"scripts/legacy_dataset/publish.py" = ["F401"]
"scripts/publish_existing_crab_demo.py" = ["F401"]
"analyses/**" = ["F401", "F811"]
